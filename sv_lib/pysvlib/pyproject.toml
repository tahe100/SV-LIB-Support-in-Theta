[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "PySvLib"
requires-python = ">= 3.12"
dynamic = ["version"]
authors = [
    { name = "Marian Lingsch-Rosenfeld", email = "marian.lingsch-rosenfeld@ifi.lmu.de" },
    { name = "Gidon Ernst", email = "gidon.ernst@ifi.lmu.de" }
]
maintainers = [
    { name = "Marian Lingsch-Rosenfeld", email = "marian.lingsch-rosenfeld@ifi.lmu.de" },
    { name = "Gidon Ernst", email = "gidon.ernst@ifi.lmu.de" }
]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
license = { text = "Apache-2.0" }
dependencies = [
    "ply == 3.11",
    "z3-solver == 4.15",
    "frozendict == 2.4.7",
    "antlr4-python3-runtime == 4.13.2",
    "antlr4-tools == 0.2.2",
    "llvmlite == 0.46.0",
    "networkx == 3.6.1"
]

[tool.hatch.version]
path = "src/pysvlib/__init__.py"

[project.scripts]
pysvlib = "pysvlib.pysvlib_cli:pysvlib_main"

[tool.ruff]
line-length = 120
exclude = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[project.optional-dependencies]
test = [
    "coverage >= 7.11.0",
    "pytest >= 8.4.2",
    "pytest-cov >= 7.0.0",
]

[tool.hatch.envs.test]
features = [
    "test",
]

scripts.cov = "sed -i 's@https://central.sonatype.com/solrsearch/select?q=a:antlr4-master+g:org.antlr@https://search.maven.org/solrsearch/select?q=a:antlr4-master+g:org.antlr@g' \"$(python3 -c \"import antlr4_tool_runner, inspect; print(inspect.getfile(antlr4_tool_runner))\")\" && pytest -vv --cov=src --cov-report=xml --cov-report=term src/"


[tool.hatch.build.hooks.custom]
path = "build_scripts/build_hooks.py"

[tool.hatch.build.targets.custom]
path = "build_scripts/build_targets.py"
dependencies = [
    "wheel >= 0.46.3"
]